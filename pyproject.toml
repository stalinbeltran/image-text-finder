[project]
name = "image-text-finder"
version = "0.1.0"
description = "Patch-based paragraph-corner detection over image-text-sample-generator datasets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
]
sweep = [
    # H — the hyperparameter sweep (optuna is the ENGINE, not the organisation:
    # its trials are not our runs, librerias.md). SQLite storage ships with it.
    "optuna>=3.6",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
itf-extract = "itf.patches.cli:main"
itf-resize = "itf.datasets.cli:main"
itf-train = "itf.training.cli:main"
itf-api = "itf.api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
